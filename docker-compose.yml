version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=ossn
      - MYSQL_PASSWORD=ossn_secret
      - MYSQL_DATABASE=opensource_socialnetwork
    depends_on:
      - db
    volumes:
      - .:/var/www/html

  db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: opensource_socialnetwork
      MYSQL_USER: ossn
      MYSQL_PASSWORD: ossn_secret
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
